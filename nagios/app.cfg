define host {
    host_name               logistics-app
    alias                   Logistics Management Application
    address                 app
    max_check_attempts      5
    check_interval          1
    retry_interval           1
    check_period             24x7
    check_command            check-host-alive
}

define host {
    host_name               logistics-mysql
    alias                   Logistics MySQL Database
    address                 mysql
    max_check_attempts      5
    check_interval          1
    retry_interval           1
    check_period             24x7
    check_command            check-host-alive
}

define service {
    host_name               logistics-app
    service_description     Logistics Web Application
    check_command           check_http!-p 3000
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period             24x7
}

define service {
    host_name               logistics-mysql
    service_description     MySQL Database Port
    check_command           check_tcp!3306
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period             24x7
}